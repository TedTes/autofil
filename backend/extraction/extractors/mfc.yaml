# mfc.yaml
# Master Field Catalog (MFC) – 50+ Core Insurance Fields
# Expanded to include ACORD 126 GL limits/premiums/checkboxes
# Version: 1.1

schema_version: "1.1"
updated_at: "2025-11-19"
updated_by: "data-team"

fields:

  # ======================================================================
  # 1. INSURED / APPLICANT
  # ======================================================================
  InsuredName:
    id: F001
    type: string
    cardinality: one-to-many
    aliases:
      - "Named Insured"
      - "Applicant Name"
      - "Policyholder"
      - "Named Insured"
      - "Business Name"
      - "Legal Entity"
    targets:
      acord_126_pdf: "form1[0].#subform[0].ApplicantName[0]"

  DBA:
    id: F002
    type: string
    cardinality: zero-to-many
    aliases:
      - "Doing Business As"
    targets:
      acord_126_pdf: "form1[0].#subform[0].DBA[0]"

  FEIN:
    id: F003
    type: string
    aliases:
      - "Federal ID"
      - "EIN"
      - "Tax ID"
    targets:
      acord_126_pdf: "form1[0].#subform[0].FEIN[0]"

  # ======================================================================
  # 2. ADDRESS
  # ======================================================================
  MailingAddress:
    id: F010
    type: object
    structure:
      street: string
      city: string
      state: string
      zip: string
      country: string
    aliases:
      - "Business Address"
    targets:
      acord_126_pdf: "form1[0].#subform[0].MailingAddress"

  # ======================================================================
  # 3. POLICY BASICS
  # ======================================================================
  PolicyNumber:
    id: F020
    type: string
    aliases:
      - "Policy #"
      - "Quote Number"
    targets:
      acord_126_pdf: "form1[0].#subform[0].PolicyNumber[0]"

  EffectiveDate:
    id: F021
    type: date
    aliases:
      - "Effective Date"
      - "Eff. Date"
    targets:
      acord_126_xml: "Policy/EffectiveDate"

  ExpirationDate:
    id: F022
    type: date
    aliases:
      - "Expiration"
    targets:
      acord_126_xml: "Policy/ExpirationDate"

  LineOfBusiness:
    id: F023
    type: string
    aliases:
      - "LOB"
    targets:
      metadata: "line_of_business"

  # ======================================================================
  # 4. GENERAL LIABILITY CLASSIFICATION
  # ======================================================================
  Classification:
    id: F100
    type: object
    cardinality: one-to-many
    structure:
      class_code: string
      description: string
      premium_basis: string
      exposure: money
      rate: money
      premium: money
    aliases:
      - "GL Classification"
      - "Hazard Class"
    targets:
      acord_126_xml:
        path: "Classification"
        repeating: true

  GrossSales:
    id: F101
    type: money
    aliases:
      - "Annual Sales"
      - "Revenue"
    targets:
      acord_126_pdf: "form1[0].#subform[1].GrossSales[0]"

  Payroll:
    id: F102
    type: money
    aliases:
      - "Total Payroll"
    targets:
      acord_126_pdf: "form1[0].#subform[1].Payroll[0]"

  NumberOfEmployees:
    id: F103
    type: integer
    aliases:
      - "Employees"
    targets:
      acord_126_pdf: "form1[0].#subform[1].NumEmployees[0]"

  # ======================================================================
  # 5. GL LIMITS & COVERAGES (NEWLY ADDED)
  # ======================================================================
  GeneralAggregate:
    id: F120
    type: money
    aliases:
      - "General Aggregate"
      - "Gen Aggregate"
    targets:
      acord_126_pdf: ""

  ProductsCompletedOperationsAggregate:
    id: F121
    type: money
    aliases:
      - "Products & Completed Ops Aggregate"
      - "Prod/CO Aggregate"
    targets:
      acord_126_pdf: ""

  PersonalAdvertisingInjury:
    id: F122
    type: money
    aliases:
      - "Personal & Advertising Injury"
    targets:
      acord_126_pdf: ""

  EachOccurrence:
    id: F123
    type: money
    aliases:
      - "Each Occurrence"
      - "Occurrence Limit"
    targets:
      acord_126_pdf: ""

  DamageToRentedPremises:
    id: F124
    type: money
    aliases:
      - "Damage to Rented Premises"
      - "Fire Damage Limit"
    targets:
      acord_126_pdf: ""

  MedicalExpense:
    id: F125
    type: money
    aliases:
      - "Med Expense"
      - "Medical Payments"
    targets:
      acord_126_pdf: ""

  # ======================================================================
  # 6. DEDUCTIBLES (NEW)
  # ======================================================================
  BodilyInjuryDeductible:
    id: F130
    type: money
    aliases:
      - "BI Deductible"
    targets:
      acord_126_pdf: ""

  PropertyDamageDeductible:
    id: F131
    type: money
    aliases:
      - "PD Deductible"
    targets:
      acord_126_pdf: ""

  EmployeeBenefitsLimit:
    id: F132
    type: money
    aliases:
      - "Employee Benefits Liability"
    targets:
      acord_126_pdf: ""

  # ======================================================================
  # 7. PREMIUMS (NEW)
  # ======================================================================
  PremisesOperationsPremium:
    id: F140
    type: money
    aliases:
      - "Prem Ops Premium"
    targets:
      acord_126_pdf: ""

  ProductsPremium:
    id: F141
    type: money
    aliases:
      - "Products Premium"
    targets:
      acord_126_pdf: ""

  OtherCoveragePremium:
    id: F142
    type: money
    aliases:
      - "Other GL Premium"
      - "Other Coverage Premium"
    targets:
      acord_126_pdf: ""

  TotalPremium:
    id: F143
    type: money
    aliases:
      - "Total GL Premium"
      - "Total Premium"
    targets:
      acord_126_pdf: ""

  # ======================================================================
  # 8. CLAIMS-MADE FLAGS (NEW)
  # ======================================================================
  ClaimsMade:
    id: F150
    type: boolean
    aliases:
      - "Claims Made"
    targets:
      acord_126_pdf: ""

  Occurrence:
    id: F151
    type: boolean
    aliases:
      - "Occurrence Basis"
      - "Occur"
    targets:
      acord_126_pdf: ""

  # ======================================================================
  # 9. MISC
  # ======================================================================
  ProducerName:
    id: F500
    type: string
    aliases:
      - "Producer"
      - "Agent Name"
    targets:
      acord_126_pdf: "form1[0].#subform[0].Producer[0]"

  Carrier:
    id: F502
    type: string
    aliases:
      - "Carrier"
      - "Underwriter"
    targets:
      acord_126_pdf: "form1[0].#subform[0].Carrier[0]"
