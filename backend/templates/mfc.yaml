        aliases: ["Carrier", "Insurance Company"]
        targets:
          acord_126_pdf: "Insurer_FullName_A"
      CarrierNAIC:
        id: F503
        type: string
        aliases: ["Carrier NAIC", "NAIC", "Insurer NAIC"]
        targets: {}
      AdditionalCarriers:
        id: F509
        type: object
        cardinality: zero-to-many
        structure:
          letter: string
          name: string
          naic: string
        aliases: ["Additional Carriers", "Supporting Carriers", "Insurers"]
        targets: {}
      SubmissionDate:
        id: F501
        type: date
        aliases: ["Submission Date"]
        targets:
          metadata: "submission_date"

  locations:
    display_name: "Locations & Properties"
    description: "Physical locations and property details"
    priority: 3
    icon: "map-pin"
    fields:
      Location:
        id: F011
        type: object
        cardinality: one-to-many
        structure:
          location_number: string
          address: string
          city: string
          state: string
          zip: string
          building_number: string
          construction: string
          occupancy: string
          square_feet: integer
          year_built: integer
        targets:
          acord_125_xml:
            path: "Location"
            repeating: true
      BuildingLimit:
        id: F110
        type: money
        aliases: ["Building Limit"]
        targets:
          acord_125_pdf: "BuildingLimit"
      BPPLimit:
