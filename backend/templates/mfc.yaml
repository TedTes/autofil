# mfc.yaml (schema v2)
# Master Field Catalog with semantic grouping baked in

schema_version: "2.0"
updated_at: "2025-12-03"
updated_by: "data-team"

semantic_groups:
  insured:
    display_name: "Insured Information"
    description: "Business entity details and contact information"
    priority: 1
    icon: "building"
    fields:
      InsuredName:
        id: F001
        type: string
        cardinality: one-to-many
        aliases:
          - "Named Insured"
          - "Applicant Name"
          - "Policyholder"
          - "Business Name"
          - "Legal Entity"
        targets:
          acord_126_pdf: "NamedInsured_FullName_A"
      DBA:
        id: F002
        type: string
        cardinality: zero-to-many
        aliases:
          - "Doing Business As"
          - "Trade Name"
        targets: {}
      FEIN:
        id: F003
        type: string
        aliases: ["FEIN", "Federal ID", "EIN"]
        targets: {}
      MailingAddress:
        id: F010
        type: object
        structure:
          street: string
          city: string
          state: string
          zip: string
          country: string
        aliases: ["Mailing Address"]
        targets: {}

  policy:
    display_name: "Policy Information"
    description: "Policy identifiers, dates, and basic details"
    priority: 2
    icon: "file-text"
    fields:
